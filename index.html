<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/brand/logo/badge-mark-small.svg" />
        <link rel="apple-touch-icon" href="/brand/logo/app-icon-badge.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Gauge is a net-worth tracker for the things you can touch." />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#1A140D" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Schibsted+Grotesk:wght@500;600;700&family=Big+Shoulders:wght@500;700;800;900&family=Big+Shoulders+Stencil:wght@800&display=swap"
        />
        <!-- dark ("Boiler room") is the default; a saved light choice applies before the first paint -->
        <script>
            try {
                if (localStorage.getItem('gauge-theme') === 'light') document.documentElement.classList.remove('dark');
            } catch {}
        </script>
        <title>Gauge</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
